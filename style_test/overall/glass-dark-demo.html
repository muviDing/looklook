<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛玻璃深色主题演示</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="dark-theme.css">
  <style>
    /* 基础样式 */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111827;
      color: #e5e7eb;
    }
    
    body.dark-theme.with-glass-effect {
      background-image: url('https://source.unsplash.com/random/1920x1080/?dark,abstract');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .demo-section {
      margin-bottom: 3rem;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .demo-header {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* 控制按钮样式 */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    
    .control-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      background-color: #4c1d95;
      color: white;
    }
    
    .control-btn:hover {
      background-color: #5b21b6;
    }

    /* 导入实际应用的基础样式 */
    .app-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    /* 标题栏 */
    .title-bar {
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .title {
      display: flex;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
    }
    
    .window-controls {
      display: flex;
      align-items: center;
    }
    
    .window-controls button {
      background: transparent;
      border: none;
      margin-left: 0.5rem;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    
    /* 搜索和筛选 */
    .search-filter-bar {
      padding: 1rem;
      display: flex;
      align-items: center;
    }
    
    .search-box {
      flex-grow: 1;
      position: relative;
    }
    
    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem 0.5rem 2.5rem;
      border-radius: 0.375rem;
    }
    
    .search-box i {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
    }
    
    /* 功能按钮 */
    .function-bar {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .batch-actions {
      display: flex;
      align-items: center;
    }
    
    .selection-controls {
      display: flex;
      align-items: center;
    }
    
    .batch-buttons {
      display: flex;
      align-items: center;
    }
    
    .view-toggle {
      display: flex;
      overflow: hidden;
    }
    
    /* 视频列表 */
    .video-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* 表格视图 */
    .table-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .video-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      table-layout: fixed;
    }
    
    .video-table th, .video-table td {
      padding: 0.75rem;
      text-align: left;
    }
    
    /* 画廊视图 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 0;
      width: 100%;
    }
    
    .video-card {
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }
    
    .video-thumbnail {
      aspect-ratio: 16 / 9;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    
    .video-info {
      padding: 0.75rem;
    }
    
    .video-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .video-actors {
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
    
    .star-rating {
      display: flex;
      gap: 2px;
      margin-top: 0.5rem;
    }
    
    .star {
      font-size: 0.75rem;
    }
    
    .video-card-checkbox {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      z-index: 10;
    }
    
    /* 页脚 */
    .footer {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .pagination {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .page-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .page-jump {
      display: flex;
      align-items: center;
    }
    
    .page-jump input {
      width: 48px;
      text-align: center;
    }
  </style>
</head>
<body class="dark-theme with-glass-effect">
  <div class="container">
    <div class="header">
      <h1 class="text-3xl font-bold mb-2">毛玻璃深色主题演示</h1>

    <!-- 画廊视图演示 -->
    <div class="demo-section">
      <div class="demo-header">

      </div>
      
      <div class="app-container">

        <div class="title-bar">
          <div class="title">

            <button id="close-btn" title="关闭">
              <i class="fas fa-times"></i>

        </div>

        <!-- 搜索和筛选 -->
        <div class="search-filter-bar">
          <div class="search-box mr-4">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索视频..." class="search-input">
          </div>
          <button class="filter-btn px-3 py-1.5 rounded-md flex items-center">
            <i class="fas fa-filter mr-2"></i>
            筛选

        </div>

        <!-- 功能按钮 -->

            <button class="import-btn px-3 py-1.5 rounded-md">
              <i class="fas fa-file-import mr-2"></i>
              导入视频

          <div class="center-actions">
            <button class="refresh-btn px-3 py-1.5 rounded-md">

            <button class="sort-btn px-3 py-1.5 rounded-md ml-2">

              表格视图

            <button class="grid-view-btn px-3 py-1.5 active">
              <i class="fas fa-th mr-1"></i>
              画廊视图
            </button>
          </div>
        </div>

        <!-- 视频列表 -->
        <div class="video-list-container" style="min-height: 500px;">
          <!-- 画廊视图 -->
          <div class="video-grid" id="video-grid">
            <!-- 视频卡片1 -->
            <div class="video-card">
              <input type="checkbox" class="video-card-checkbox" checked>
              <div class="video-thumbnail" style="background-image: url('https://via.placeholder.com/240x135?text=Video+1');"></div>
              <div class="video-info">
                <div class="video-title">示例视频1.mp4</div>
                <div class="video-actors">
                  <i class="fas fa-user"></i> 演员A
                </div>
                <div class="star-rating">
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star"></i>
                </div>
              </div>
            </div>
            
            <!-- 视频卡片2 -->
            <div class="video-card">
              <input type="checkbox" class="video-card-checkbox">
              <div class="video-thumbnail" style="background-image: url('https://via.placeholder.com/240x135?text=Video+2');"></div>
              <div class="video-info">
                <div class="video-title">示例视频2.mp4</div>
                <div class="video-actors">
                  <i class="fas fa-user"></i> 演员B
                </div>
                <div class="star-rating">
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star"></i>
                  <i class="star fas fa-star"></i>
                </div>
              </div>
            </div>
            
            <!-- 视频卡片3 -->
            <div class="video-card">
              <input type="checkbox" class="video-card-checkbox">
              <div class="video-thumbnail" style="background-image: url('https://via.placeholder.com/240x135?text=Video+3');"></div>
              <div class="video-info">
                <div class="video-title">示例视频3.mp4</div>
                <div class="video-actors">
                  <i class="fas fa-user"></i> 演员C
                </div>
                <div class="star-rating">
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                </div>
              </div>
            </div>
            
            <!-- 视频卡片4 -->
            <div class="video-card">
              <input type="checkbox" class="video-card-checkbox" checked>
              <div class="video-thumbnail" style="background-image: url('https://via.placeholder.com/240x135?text=Video+4');"></div>
              <div class="video-info">
                <div class="video-title">示例视频名称可能很长很长很长.mp4</div>
                <div class="video-actors">
                  <i class="fas fa-user"></i> 演员D
                </div>
                <div class="star-rating">
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star filled"></i>
                  <i class="star fas fa-star"></i>
                  <i class="star fas fa-star"></i>
                  <i class="star fas fa-star"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
          <div class="video-count">
            共 <span id="total-count">120</span> 个视频
          </div>
          <div class="flex items-center">
            <div class="page-size-selector mr-4">
              <select class="border rounded px-2 py-1 text-sm">
                <option value="20">20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
              </select>
            </div>
            <div class="pagination">
              <button class="page-btn" disabled><i class="fas fa-chevron-left"></i></button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn">3</button>
              <button class="page-btn"><i class="fas fa-ellipsis-h"></i></button>
              <button class="page-btn">6</button>
              <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="page-jump ml-4 flex items-center">
              <span class="text-sm mr-2">跳至</span>
              <input type="number" min="1" value="1" class="border rounded px-2 py-1 text-sm">
              <span class="text-sm ml-2">页</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 表格视图演示 -->
    <div class="demo-section">
      <div class="demo-header">
        <h2 class="text-xl font-semibold">表格视图</h2>
      </div>
      
      <div class="app-container">
        <!-- 标题栏 -->
        <div class="title-bar">
          <div class="title">
            <h1 class="text-xl font-bold">早该看看了</h1>
          </div>
          <div class="window-controls">
            <button id="settings-btn-2" title="设置">
              <i class="fas fa-cog"></i>
            </button>
            <button id="minimize-btn-2" title="最小化">
              <i class="fas fa-window-minimize"></i>
            </button>
            <button id="maximize-btn-2" title="最大化">
              <i class="fas fa-window-maximize"></i>
            </button>
            <button id="close-btn-2" title="关闭">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- 搜索和筛选 -->
        <div class="search-filter-bar">
          <div class="search-box mr-4">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索视频..." class="search-input">
          </div>
          <button class="filter-btn px-3 py-1.5 rounded-md flex items-center">
            <i class="fas fa-filter mr-2"></i>

          </button>
        </div>

        <!-- 功能按钮 -->
        <div class="function-bar">
          <div class="left-actions">
            <button class="import-btn px-3 py-1.5 rounded-md">
              <i class="fas fa-file-import mr-2"></i>
              导入视频
            </button>
          </div>
          
          <div class="center-actions">
            <button class="refresh-btn px-3 py-1.5 rounded-md">
              <i class="fas fa-sync-alt mr-2"></i>
              刷新
            </button>
            <button class="sort-btn px-3 py-1.5 rounded-md ml-2">
              <i class="fas fa-sort mr-2"></i>
              排序
            </button>
          </div>
          
          <div class="view-toggle">
            <button class="table-view-btn px-3 py-1.5 active">
              <i class="fas fa-table mr-1"></i>
              表格视图
            </button>
            <button class="grid-view-btn px-3 py-1.5">
              <i class="fas fa-th mr-1"></i>
              画廊视图
            </button>
          </div>
        </div>

        <!-- 视频列表 -->
        <div class="video-list-container" style="min-height: 400px;">
          <!-- 表格视图 -->
          <div class="table-container">
            <table class="video-table" id="video-table">
              <thead>
                <tr>
                  <th width="40px">
                    <input type="checkbox" id="select-all-table">
                  </th>
                  <th width="200px">文件名</th>
                  <th width="120px">番号</th>
                  <th width="150px">合集</th>
                  <th width="150px">演员</th>
                  <th width="100px">分辨率</th>
                  <th width="80px">评分</th>
                  <th width="100px">观看次数</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><input type="checkbox" checked></td>

                </tr>
                <tr>
                  <td><input type="checkbox"></td>
                  <td>示例视频2.mp4</td>
                  <td>DEF-456</td>
                  <td>示例合集2</td>
                  <td>演员B</td>
                  <td>720p</td>
                  <td>3.5</td>

                </tr>
                <tr>
                  <td><input type="checkbox"></td>

                  <td>示例合集1</td>

                  <td>4K</td>

            </table>

        <!-- 页脚 -->

          <div class="video-count">
            共 <span id="total-count-2">120</span> 个视频
          </div>
          <div class="flex items-center">
            <div class="page-size-selector mr-4">

                <option value="50">50条/页</option>

            <div class="pagination">

  </div>
  
  <script>
    // 切换毛玻璃效果
    function toggleGlassEffect() {
      document.body.classList.toggle('with-glass-effect');
    }
    
    // 更换背景图片
    function changeBackground() {
      if (document.body.classList.contains('with-glass-effect')) {
        const timestamp = new Date().getTime();
        document.body.style.backgroundImage = `url('https://source.unsplash.com/random/1920x1080/?dark,abstract&t=${timestamp}')`;
      }
    }
  </script>
</body>
